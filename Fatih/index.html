<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Ulang Tahun</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh; overflow:hidden; font-family:Poppins;
  display:flex; justify-content:center; align-items:center;
  color:#fff; background:#0a0a0a;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0;
  background:radial-gradient(circle at 30% 30%, rgba(255,215,0,0.15), transparent 50%),
             radial-gradient(circle at 70% 70%, rgba(255,105,180,0.12), transparent 50%);
  animation:bgShift 8s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{transform:scale(1)}100%{transform:scale(1.05)}}

/* OVERLAY */
#overlay{
  position:fixed; inset:0; background:rgba(5,5,15,0.9); z-index:999;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  transition:opacity .9s ease, visibility .9s;
}
#overlay.hide{opacity:0; visibility:hidden; pointer-events:none}
#name-display{text-align:center; min-height:100px; position:relative; width:90%;}
.name-card{position:absolute; width:100%; opacity:0; transform:translateY(15px) scale(.95); transition:all .6s ease-out}
.name-card.show{opacity:1; transform:translateY(0) scale(1)}
.from-label{font-size:1.1rem; color:#ccc; margin-bottom:6px; letter-spacing:2px}
.sender{font-size:3rem; font-weight:800; color:#FFD700; text-shadow:0 0 15px rgba(255,215,0,.5)}
.dots{margin-top:20px; display:flex; gap:8px}
.dot{width:8px;height:8px;background:#444;border-radius:50%;transition:.3s}
.dot.on{background:#FFD700;transform:scale(1.4)}

/* MAIN */
.main{
  width:95%; height:95%; max-height:98vh; border-radius:20px;
  background:rgba(10,10,20,0.6); border:2px solid rgba(255,215,0,.4);
  display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
  padding:20px 15px 70px; position:relative; z-index:10;
  box-shadow:0 0 30px rgba(255,215,0,.15);
}
h1{font-family:'Playfair Display'; font-size:3.2rem; color:#FFD700; text-align:center}
.cards{display:flex; gap:15px; padding:12px; background:rgba(255,255,255,.08); border-radius:18px; border:1px solid rgba(255,215,0,.3)}
.card{width:140px; text-align:center; opacity:0; transform:translateY(20px); animation:up .8s forwards; background:rgba(0,0,0,.3); padding:10px; border-radius:15px; border:1px solid rgba(255,215,0,.2)}
.card:nth-child(1){animation-delay:.2s} .card:nth-child(2){animation-delay:.5s}
.card:nth-child(3){animation-delay:.8s} .card:nth-child(4){animation-delay:1.1s}
@keyframes up{to{opacity:1; transform:translateY(0)}}
.frame{width:100px;height:100px;margin:0 auto 8px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#FFD700,#fff,#FFD700);box-shadow:0 0 15px rgba(255,215,0,.4)}
.frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff}
.card h3{margin-top:8px;color:#FFD700;font-size:1rem}
.ucapan{
  position:relative; bottom:auto; width:90%; max-width:650px;
  text-align:center; font-size:14px; color:#eee;
  background:rgba(0,0,0,.4); padding:10px 18px; border-radius:40px;
  border:1px solid rgba(255,215,0,.3); min-height:45px;
}
.cursor{display:inline-block;width:2px;height:16px;background:#FFD700;vertical-align:middle;animation:blink .6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.music-btn{
  position:absolute; bottom:12px; right:15px; background:#FFD700; color:#000;
  padding:8px 16px; border-radius:25px; cursor:pointer; font-weight:600; font-size:13px;
  box-shadow:0 0 12px rgba(255,215,0,.4); transition:transform .2s
}
.music-btn:hover{transform:scale(1.05)}

/* PARTICLES (CSS ONLY ANIMATION) */
.particle{position:fixed; pointer-events:none; z-index:5; font-size:16px; animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0); opacity:1} 100%{transform:translateY(110vh) rotate(360deg); opacity:0}}

@media(max-width:768px){
  h1{font-size:2.2rem} .sender{font-size:2.2rem} .cards{gap:10px; padding:10px}
  .card{width:120px} .frame{width:85px;height:85px} .ucapan{font-size:13px; padding:8px 14px}
  .main{height:96%; padding:15px 10px 65px; gap:8px}
}
</style>
</head>

<body>

<div id="overlay">
  <div style="font-size:4rem;margin-bottom:12px">🎂</div>
  <div id="name-display"></div>
  <div class="dots" id="dots"></div>
</div>

<audio id="music" autoplay loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="main">
  <h1>🎉 Selamat Ulang Tahun 🎉</h1>
  <div class="cards">
    <div class="card"><div class="frame"><img src="fani.jpg"></div><h3>Dek Fani</h3></div>
    <div class="card"><div class="frame"><img src="fina.jpg"></div><h3>Dek Fina</h3></div>
    <div class="card"><div class="frame"><img src="fatih.jpg"></div><h3>Uda Fatih</h3></div>
    <div class="card"><div class="frame"><img src="uniang.jpg"></div><h3>Mak Uniang 👑</h3></div>
  </div>
  <div class="ucapan"><span id="text"></span><span class="cursor"></span></div>
  <div class="music-btn" id="btn" onclick="toggleMusic()">🎵 Musik</div>
</div>

<script>
const senders = ["Lutfi", "Dilla", "Atik", "BG Miko", "Kak Rani", "Kak Ica", "BG Megi", "BG Mul", "Bu Ndut", "Bu Yang","Teti", "Ayah Pii", "Ayah Mansur", "Om Kitok", "Pak Ajo", "Pak Sep", "Pak Ilham", "Pak Acik", "Pak Uyung", "Pak Af"];
const overlay = document.getElementById('overlay');
const nameBox = document.getElementById('name-display');
const dotsBox = document.getElementById('dots');
let idx = 0, nameTimer, closeTimer, resetTimer, confettiPool = [];

// Init Dots
dotsBox.innerHTML = senders.map((_,i)=>`<div class="dot${i===0?' on':''}"></div>`).join('');

// Particle Generator (Ringan: dibuat sekali, animasi CSS)
function initParticles(){
  const emojis = ['✨','🎈','💫','🎁','🌟','💖'];
  for(let i=0;i<18;i++){
    let p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[i%emojis.length];
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = (5 + Math.random()*5) + 's';
    p.style.animationDelay = Math.random()*6 + 's';
    p.style.fontSize = (14 + Math.random()*6) + 'px';
    document.body.appendChild(p);
    confettiPool.push(p);
  }
}
initParticles();

// Overlay Sequence
function showNext(){
  let cur = nameBox.querySelector('.name-card.show');
  if(cur) cur.classList.remove('show');
  setTimeout(()=>{
    nameBox.innerHTML = '';
    if(idx >= senders.length){
      nameBox.innerHTML = `<div class="name-card show"><div class="from-label">🎁 SELAMAT ULANG TAHUN FANI FINA FATIH MAK UNIANG</div><div class="sender">🥳 Selamat Merayakan!</div></div>`;
      dotsBox.style.display='none';
      clearInterval(nameTimer);
      closeTimer = setTimeout(openMain, 1800);
      return;
    }
    nameBox.innerHTML = `<div class="name-card show"><div class="from-label">💝 Selamat Ulang Tahun Dari</div><div class="sender">${senders[idx]}</div></div>`;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on', i===idx));
    idx++;
  }, 400);
}

function openMain(){
  overlay.classList.add('hide');
  startTyping();
  let a = document.getElementById('music');
  a.play().then(()=>document.getElementById('btn').textContent='🎵 ON').catch(()=>{});
}

function startTyping(){
  const msg = "Selamat ulang tahun untuk kalian semua yang kami cintai. Semoga panjang umur, sehat selalu, rezeki melimpah, dan bahagia selalu! 💖";
  let i=0, el=document.getElementById('text'); el.innerHTML='';
  (function t(){if(i<msg.length){el.innerHTML+=msg.charAt(i);i++;setTimeout(t,35)}})();
}

function toggleMusic(){
  let a=document.getElementById('music'), b=document.getElementById('btn');
  if(a.paused){a.play();b.textContent='🎵 ON'}else{a.pause();b.textContent='🔇 OFF'}
}

// 🔁 AUTO RESET 5 MENIT
function resetAll(){
  clearTimeout(closeTimer); clearInterval(nameTimer);
  overlay.classList.remove('hide');
  idx=0; nameBox.innerHTML=''; dotsBox.style.display='flex';
  dotsBox.innerHTML = senders.map((_,i)=>`<div class="dot${i===0?' on':''}"></div>`).join('');
  document.getElementById('text').innerHTML='';
  let a=document.getElementById('music'); a.pause(); a.currentTime=0;
  document.getElementById('btn').textContent='🎵 Musik';
  initParticles(); // Re-random posisi
  nameTimer = setInterval(showNext, 2400);
  showNext();
  resetTimer = setTimeout(resetAll, 300000);
}

// Start
resetTimer = setTimeout(resetAll, 300000);
nameTimer = setInterval(showNext, 2400);
showNext();
</script>
</body>
</html>
