<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Ulang Tahun Mewah 🎉</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
overflow:hidden;
font-family:Poppins;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
background:#000;
}

/* 💎 LIQUID GOLD BACKGROUND */
body::before{
content:'';
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle at 30% 30%, rgba(255,215,0,0.25), transparent),
radial-gradient(circle at 70% 70%, rgba(212,175,55,0.2), transparent);
animation:liquid 12s infinite linear;
z-index:0;
}

@keyframes liquid{
0%{transform:translate(0,0)}
50%{transform:translate(-10%, -10%)}
100%{transform:translate(0,0)}
}

/* Container */
.main{
width:95%;
height:92%;
border-radius:25px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
border:2px solid rgba(212,175,55,0.5);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
position:relative;
z-index:2;
}

/* Judul */
h1{
font-family:'Playfair Display';
font-size:3.5rem;
color:#FFD700;
text-shadow:0 0 20px gold;
}

/* Cards */
.cards{
display:flex;
gap:25px;
margin-top:20px;
}

/* Card animasi */
.card{
width:170px;
text-align:center;
opacity:0;
transform:translateY(50px);
animation:fadeUp 1s forwards;
}

.card:nth-child(1){animation-delay:.5s}
.card:nth-child(2){animation-delay:1s}
.card:nth-child(3){animation-delay:1.5s}
.card:nth-child(4){animation-delay:2s}

@keyframes fadeUp{
to{opacity:1; transform:translateY(0)}
}

/* Frame emas */
.frame{
width:130px;
height:130px;
margin:auto;
border-radius:50%;
padding:5px;
background:linear-gradient(45deg,#FFD700,#fff,#FFD700);
box-shadow:0 0 25px gold;
}

.frame img{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
}

/* TYPEWRITER */
.ucapan{
position:absolute;
bottom:70px;
width:70%;
text-align:center;
font-size:15px;
color:#ddd;
min-height:60px;
}

/* cursor */
.cursor{
display:inline-block;
width:2px;
background:#FFD700;
margin-left:3px;
animation:blink 1s infinite;
}

@keyframes blink{
0%,50%,100%{opacity:1}
25%,75%{opacity:0}
}

/* 🎉 efek ulang tahun */
.balloon{
position:absolute;
bottom:-100px;
font-size:25px;
animation:float 8s infinite;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-120vh)}
}

.sparkle{
position:absolute;
width:4px;height:4px;
background:gold;
border-radius:50%;
animation:spark 3s infinite;
}

@keyframes spark{
0%{transform:translateY(100vh)}
100%{transform:translateY(-10vh)}
}

/* tombol musik */
.music-btn{
position:absolute;
bottom:15px;
right:20px;
background:gold;
color:#000;
padding:8px 15px;
border-radius:30px;
cursor:pointer;
}
</style>
</head>

<body>

<audio id="music" autoplay loop>
<source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="main">

<h1>🎉 Selamat Ulang Tahun 🎉</h1>

<div class="cards">

<div class="card">
<div class="frame"><img src="fani.jpg"></div>
<h3>Dek Fani</h3>
</div>

<div class="card">
<div class="frame"><img src="fina.jpg"></div>
<h3>Dek Fina</h3>
</div>

<div class="card">
<div class="frame"><img src="fatih.jpg"></div>
<h3>Uda Fatih</h3>
</div>

<div class="card">
<div class="frame"><img src="uniang.jpg"></div>
<h3>Mak Uniang 👑</h3>
</div>

</div>

<div class="ucapan">
<span id="text"></span><span class="cursor"></span>
</div>

<div class="music-btn" onclick="toggleMusic()">🔊 Musik</div>

</div>

<script>
// TYPEWRITER TEXT
const message = "Selamat ulang tahun untuk kalian semua yang kami cintai. Semoga panjang umur, sehat selalu, rezeki melimpah, dan kebahagiaan selalu menyertai setiap langkah. Dengan penuh cinta dari kami, kemenakan dan anak-anakmu ❤️";
let i=0;
function typing(){
if(i<message.length){
document.getElementById("text").innerHTML += message.charAt(i);
i++;
setTimeout(typing,40);
}
}
typing();

// BALLOON
for(let i=0;i<10;i++){
let b=document.createElement('div');
b.className='balloon';
b.innerHTML='🎈';
b.style.left=Math.random()*100+'%';
b.style.animationDelay=Math.random()*5+'s';
document.body.appendChild(b);
}

// SPARKLE
for(let i=0;i<20;i++){
let s=document.createElement('div');
s.className='sparkle';
s.style.left=Math.random()*100+'%';
s.style.animationDelay=Math.random()*3+'s';
document.body.appendChild(s);
}

// musik
let audio=document.getElementById("music");
function toggleMusic(){
audio.paused?audio.play():audio.pause();
}

// autoplay fix
document.body.addEventListener("click",()=>audio.play(),{once:true});
</script>

</body>
</html>
