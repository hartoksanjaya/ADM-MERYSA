<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉✨ PESTA ULANG TAHUN MEWAH ✨🎉</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
    height:100vh;
    overflow:hidden;
    font-family:Poppins;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    background:#0a0a0a;
}

body::before{
    content:''; position:absolute; width:200%;height:200%;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,105,180,0.3), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(255,215,0,0.4), transparent 40%),
        radial-gradient(circle at 40% 80%, rgba(135,206,250,0.3), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(212,175,55,0.35), transparent 40%);
    animation:liquid 10s infinite ease-in-out; z-index:0;
}
@keyframes liquid{
    0%,100%{transform:translate(0,0) scale(1)}
    25%{transform:translate(-5%, 5%) scale(1.02)}
    50%{transform:translate(-10%, -10%) scale(0.98)}
    75%{transform:translate(5%, -5%) scale(1.01)}
}

/* 🔥 OVERLAY UCAPAN (DEPAN) 🔥 */
#overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.88);
    backdrop-filter:blur(18px); z-index:9999;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    transition: opacity 1s ease;
}
#overlay.fade-out{ opacity:0; pointer-events:none; }

#name-display{ text-align:center; min-height:130px; position:relative; width:100%; padding:0 20px; }
.name-card{ position:absolute; width:100%; opacity:0; transform:scale(0.6) translateY(20px); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.name-card.active{ opacity:1; transform:scale(1) translateY(0); }
.from-label{ font-size:1.3rem; color:rgba(255,255,255,0.85); margin-bottom:8px; letter-spacing:3px; font-weight:600; }
.sender-name{ font-size:3.8rem; font-weight:800; background:linear-gradient(90deg,#FFD700,#ff6b6b,#4d96ff,#FFD700); background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:rainbowShift 3s infinite linear; text-shadow:0 0 30px rgba(255,215,0,0.6); }
@keyframes rainbowShift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.dots{ margin-top:30px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.dot{ width:9px; height:9px; background:rgba(255,255,255,0.25); border-radius:50%; transition:0.4s; }
.dot.active{ background:#FFD700; transform:scale(1.5); box-shadow:0 0 12px #FFD700; }

/* 🔹 MAIN CONTAINER (DIPERBAIKI JARAKNYA) 🔹 */
.main{
    width:95%; height:94%; max-height:96vh;
    border-radius:30px; background:rgba(10,10,20,0.25);
    backdrop-filter:blur(8px);
    border:3px solid transparent;
    border-image:linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b) 1;
    display:flex; flex-direction:column; align-items:center;
    justify-content: space-evenly; /* Distribusi rata atas-bawah */
    gap: 15px; /* Jarak antar elemen */
    padding: 25px 15px 80px; /* Padding bawah untuk tombol musik */
    position:relative; z-index:10;
    box-shadow:0 0 60px rgba(255,215,0,0.3);
    animation:borderGlow 3s infinite alternate;
}
@keyframes borderGlow{ from{box-shadow:0 0 60px rgba(255,215,0,0.3)} to{box-shadow:0 0 80px rgba(255,105,180,0.6), 0 0 120px rgba(255,215,0,0.4)} }

h1{ font-family:'Playfair Display'; font-size:3.8rem; background:linear-gradient(45deg, #FFD700, #ff6b6b, #4d96ff, #6bcb77, #FFD700); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:titleRainbow 3s infinite linear; padding:10px 25px; text-align:center; }
@keyframes titleRainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.cards{
    display:flex; gap:18px; margin:0; padding:15px;
    background:rgba(255,255,255,0.08); border-radius:25px;
    backdrop-filter:blur(5px); border:2px solid rgba(255,215,0,0.4);
    flex-wrap:wrap; justify-content:center;
}
.card{ width:150px; text-align:center; opacity:0; transform:translateY(30px); animation:fadeUp 1s forwards; background:rgba(0,0,0,0.3); padding:12px; border-radius:22px; border:1px solid rgba(255,215,0,0.3); }
.card:nth-child(1){animation-delay:.3s} .card:nth-child(2){animation-delay:.6s} .card:nth-child(3){animation-delay:.9s} .card:nth-child(4){animation-delay:1.2s}
@keyframes fadeUp{to{opacity:1; transform:translateY(0)}}
.frame{ width:110px; height:110px; margin:auto; border-radius:50%; padding:4px; background:conic-gradient(from 0deg, #FFD700, #ff6b6b, #4d96ff, #6bcb77, #FFD700); box-shadow:0 0 20px gold; animation:frameRotate 4s infinite linear; }
@keyframes frameRotate{100%{transform:rotate(360deg)}}
.frame img{width:100%; height:100%; border-radius:50%; object-fit:cover; border:3px solid #fff}
.card h3{margin-top:10px; color:#FFD700; font-weight:700; text-shadow:0 0 15px gold; font-size:1.05rem}

/* UCAPAN - TIDAK LAGI ABSOLUTE (Jarak Aman) */
.ucapan{
    position:relative; /* Diubah dari absolute */
    bottom:auto;
    width:90%; max-width:700px;
    text-align:center; font-size:15px; color:#fff;
    background:rgba(0,0,0,0.4); padding:12px 20px;
    border-radius:50px; backdrop-filter:blur(5px);
    border:1px solid rgba(255,215,0,0.4);
    min-height:50px;
}
.cursor{display:inline-block; width:2px; height:18px; background:#FFD700; animation:blink 0.6s infinite; vertical-align:middle; margin-left:3px}
@keyframes blink{0%,50%,100%{opacity:1} 25%,75%{opacity:0}}

.confetti-container{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden}
.confetti{position:absolute; width:14px; height:14px; animation:confettiFall linear infinite; z-index:5}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg); opacity:1} 100%{transform:translateY(120vh) rotate(720deg); opacity:0}}
.balloon{position:absolute; bottom:-80px; font-size:28px; animation:floatUp 10s infinite linear; z-index:5}
@keyframes floatUp{0%{transform:translateY(0); opacity:1} 100%{transform:translateY(-120vh); opacity:0}}

.music-btn{
    position:absolute; bottom:15px; right:20px;
    background:linear-gradient(135deg, #FFD700, #ff6b6b);
    color:#fff; padding:10px 22px; border-radius:35px;
    cursor:pointer; font-weight:700; box-shadow:0 0 20px gold; z-index:15; transition:0.3s;
    font-size:14px;
}
.music-btn:hover{transform:scale(1.08)}

@keyframes pulseBtn{0%,100%{transform:scale(1)} 50%{transform:scale(1.05); box-shadow:0 0 40px rgba(255,105,180,0.8)}}

@media(max-width:768px){
    h1{font-size:2.6rem} .sender-name{font-size:2.4rem}
    .cards{gap:12px; padding:12px} .card{width:135px}
    .frame{width:95px; height:95px}
    .ucapan{font-size:14px; padding:10px 15px; width:95%}
    .main{height:96%; padding:20px 10px 75px; gap:10px}
}
</style>
</head>

<body>

<!-- 🔥 OVERLAY UCAPAN BERGANTIAN (AUTO) 🔥 -->
<div id="overlay">
    <div style="font-size:4.5rem; margin-bottom:15px; animation:pulseBtn 2s infinite">🎂</div>
    <div id="name-display"></div>
    <div class="dots" id="dots"></div>
</div>

<audio id="music" autoplay loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="confetti-container" id="confettiContainer"></div>

<div class="main">
    <h1>🎉 Selamat Ulang Tahun 🎉</h1>
    
    <div class="cards">
        <div class="card"><div class="frame"><img src="fani.jpg" alt="Fani"></div><h3>Dek Fani</h3></div>
        <div class="card"><div class="frame"><img src="fina.jpg" alt="Fina"></div><h3>Dek Fina</h3></div>
        <div class="card"><div class="frame"><img src="fatih.jpg" alt="Fatih"></div><h3>Uda Fatih</h3></div>
        <div class="card"><div class="frame"><img src="uniang.jpg" alt="Uniang"></div><h3>Mak Uniang 👑</h3></div>
    </div>

    <div class="ucapan"><span id="text"></span><span class="cursor"></span></div>
    <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 Putar Musik</div>
</div>

<script>
const senders = ["Lutfi", "Dilla", "Atik", "BG Miko", "Kak Rani", "Kak Ica", "BG Megi", "BG Mul", "Bu Ndut", "Bu Yang","Teti", "Ayah Pii", "Ayah Mansur", "Om Kitok", "Pak Ajo", "Pak Sep", "Pak Ilham", "Pak Acik"];
const display = document.getElementById('name-display');
const dotsContainer = document.getElementById('dots');
let idx = 0;
let nameInterval, confettiTimer, closeOverlayTimeout, resetTimer;

function initDots() {
    dotsContainer.innerHTML = ''; dotsContainer.style.display = 'flex';
    senders.forEach((_, i) => {
        let d = document.createElement('div');
        d.className = 'dot' + (i===0 ? ' active' : '');
        dotsContainer.appendChild(d);
    });
}
initDots();

function rotateName() {
    let current = display.querySelector('.name-card.active');
    if(current) current.classList.remove('active');
    setTimeout(() => {
        display.innerHTML = '';
        if(idx >= senders.length) {
            display.innerHTML = `<div class="name-card active">
                <div class="from-label" style="margin-bottom:15px">🎁 SELAMAT ULANG TAHUN FANI FINA FATIH MAK UNIANG</div>
                <div class="sender-name" style="font-size:2.5rem">🥳 Selamat Merayakan! 🥳</div>
            </div>`;
            dotsContainer.style.display = 'none';
            clearInterval(nameInterval);
            closeOverlayTimeout = setTimeout(closeOverlay, 2000);
            return;
        }
        let card = document.createElement('div');
        card.className = 'name-card';
        card.innerHTML = `<div class="from-label">💝 Selamat Ulang Tahun Dari</div><div class="sender-name">${senders[idx]}</div>`;
        display.appendChild(card); void card.offsetWidth; card.classList.add('active');
        document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === idx));
        idx++;
    }, 450);
}

function spawnMainConfetti(){
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const emojis = ['🎊','🎉','✨','💫','🎈','💖','🎁','🥳'];
    confettiTimer = setInterval(() => {
        let c = document.createElement('div');
        c.className = 'confetti';
        c.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
        c.style.left = Math.random()*100 + '%';
        c.style.animationDuration = (4 + Math.random()*3) + 's';
        container.appendChild(c);
        setTimeout(() => c.remove(), 7000);
    }, 250);
}

function closeOverlay() {
    document.getElementById('overlay').classList.add('fade-out');
    spawnMainConfetti(); startTyping();
    let audio = document.getElementById("music");
    audio.play().then(() => document.getElementById("musicBtn").innerHTML = "🎵 Musik: ON 🎶").catch(() => {});
}

function startTyping(){
    const msg = "Selamat ulang tahun untuk kalian semua yang kami cintai. Semoga panjang umur, sehat selalu, rezeki melimpah, dan kebahagiaan selalu menyertai! 💖";
    let i=0, el=document.getElementById("text"); el.innerHTML = '';
    (function type(){ if(i < msg.length){ el.innerHTML += msg.charAt(i); i++; setTimeout(type, 35); } })();
}

function initBalloons(){
    document.querySelectorAll('.balloon').forEach(b => b.remove());
    for(let i=0; i<12; i++){
        let b = document.createElement('div');
        b.className = 'balloon';
        b.innerHTML = ['🎈','✨','🎁','🥳','💖'][Math.floor(Math.random()*5)];
        b.style.left = Math.random()*100 + '%'; b.style.animationDelay = Math.random()*6 + 's';
        document.body.appendChild(b);
    }
}
initBalloons();

function toggleMusic(){
    let a = document.getElementById("music"), b = document.getElementById("musicBtn");
    if(a.paused){ a.play(); b.innerHTML = "🎵 Musik: ON 🎶"; } else { a.pause(); b.innerHTML = "🔇 Musik: OFF"; }
}

// 🔥 AUTO RESET 5 MENIT 🔥
function resetAll() {
    clearTimeout(closeOverlayTimeout); clearInterval(nameInterval); clearInterval(confettiTimer);
    document.querySelectorAll('.confetti, .balloon').forEach(el => el.remove());
    document.getElementById('confettiContainer').innerHTML = '';
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('fade-out'); overlay.style.display = 'flex';
    idx = 0; display.innerHTML = ''; initDots(); document.getElementById('text').innerHTML = '';
    const audio = document.getElementById("music"); audio.pause(); audio.currentTime = 0;
    document.getElementById("musicBtn").innerHTML = "🎵 Putar Musik";
    initBalloons();
    nameInterval = setInterval(rotateName, 2600); rotateName();
    resetTimer = setTimeout(resetAll, 300000);
}
resetTimer = setTimeout(resetAll, 300000);
nameInterval = setInterval(rotateName, 2600); rotateName();
</script>

</body>
</html>
