<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun - Keluarga Besar Toko Mas Merysa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Satu layar tanpa scroll */
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            width: 95vw;
            height: 90vh;
            border: 5px double #d4af37;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            border-radius: 20px;
        }

        /* Animasi Latar Belakang (Floating Elements) */
        .floating {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            z-index: 1;
            animation: float 6s infinite ease-in-out;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(20deg); }
        }

        .header {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #d4af37;
            text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.8), 0 0 20px #ffd700;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .names-row {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            z-index: 10;
        }

        .card {
            text-align: center;
            background: rgba(212, 175, 55, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #d4af37;
            width: 200px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-20px);
            background: rgba(212, 175, 55, 0.2);
        }

        .gif-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #d4af37;
        }

        .gif-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ceo-block {
            margin-top: 40px;
            text-align: center;
            z-index: 10;
            border-top: 2px solid #d4af37;
            padding-top: 20px;
        }

        .ceo-name {
            font-size: 2.5rem;
            color: #ffd700;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .ceo-title {
            font-size: 1.2rem;
            color: #d4af37;
            font-style: italic;
        }

        .audio-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(212, 175, 55, 0.5);
            padding: 10px;
            border-radius: 50px;
            font-size: 0.8rem;
            z-index: 20;
        }

    </style>
</head>
<body>

    <!-- Musik Latar -->
    <audio id="birthdayMusic" autoplay loop>
        <source src="musik.mp3" type="audio/mpeg">
        Browser anda tidak mendukung audio.
    </audio>

    <div class="main-container">
        <!-- Floating Emojis untuk kesan "GIF Lucu" -->
        <div class="floating" style="top: 10%; left: 5%; animation-delay: 0s;">🎂</div>
        <div class="floating" style="top: 20%; right: 10%; animation-delay: 1s;">✨</div>
        <div class="floating" style="bottom: 15%; left: 15%; animation-delay: 2s;">💎</div>
        <div class="floating" style="bottom: 10%; right: 5%; animation-delay: 0.5s;">🎉</div>
        <div class="floating" style="top: 50%; left: 2%; animation-delay: 1.5s;">🎈</div>

        <div class="header">
            <h1>Selamat Ulang Tahun!</h1>
        </div>

        <div class="names-row">
            <div class="card">
                <div class="gif-placeholder">
                    <!-- Gunakan link GIF lucu di sini -->
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZndqZndqZndqZndqZndqZndqZndqZndqZndqZndqZndqJmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/LpDmM2WXO6GfSeUbc9/giphy.gif" alt="Lucu">
                </div>
                <h3>Dek Fani</h3>
            </div>
            <div class="card">
                <div class="gif-placeholder">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZndqZndqZndqZndqZndqZndqZndqZndqZndqZndqZndqJmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/IXWw6AALCtjHO/giphy.gif" alt="Lucu">
                </div>
                <h3>Dek Fina</h3>
            </div>
            <div class="card">
                <div class="gif-placeholder">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZndqZndqZndqZndqZndqZndqZndqZndqZndqZndqZndqJmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KZG3HjhDZPiMGkh3xm/giphy.gif" alt="Lucu">
                </div>
                <h3>Uda Fatih</h3>
            </div>
        </div>

        <div class="ceo-block">
            <p style="color: #fff; margin-bottom: 5px;">Spesial untuk yang Terganteng:</p>
            <div class="ceo-name">Mak Uniang</div>
            <div class="ceo-title">CEO Toko Mas Merysa</div>
            <p style="margin-top: 10px; color: #d4af37;">"Semoga Sukses Terus & Bisnis Emasnya Semakin Berkilau!"</p>
        </div>

        <div class="audio-control">
            🔊 Musik Otomatis
        </div>
    </div>

    <script>
        // Mencoba memaksa autoplay jika browser memblokir
        window.addEventListener('mouseover', function() {
            var audio = document.getElementById('birthdayMusic');
            audio.play();
        }, { once: true });
    </script>
</body>
</html>
